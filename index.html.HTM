<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAYED & LOBNA — Luxury Wedding Invitation</title>
    
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel CDN for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --font-alexandria: 'Alexandria', sans-serif;
            --font-amiri: 'Amiri', serif;
            --font-aref: 'Aref Ruqaa', serif;
            --font-cormorant: 'Cormorant Garamond', serif;
            --font-playfair: 'Playfair Display', serif;
            --font-montserrat: 'Montserrat', sans-serif;
        }

        body {
            font-family: var(--font-alexandria);
            background-color: #0b1329;
            color: #e2e8f0;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .font-cormorant { font-family: var(--font-cormorant); }
        .font-playfair { font-family: var(--font-playfair); }
        .font-montserrat { font-family: var(--font-montserrat); }
        .font-alexandria { font-family: var(--font-alexandria); }
        .font-aref { font-family: var(--font-aref); }
        .font-amiri { font-family: var(--font-amiri); }

        /* Glassmorphism Styles */
        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .glass-card-light {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(200, 225, 255, 0.4);
            box-shadow: 0 15px 35px rgba(11, 19, 41, 0.1);
        }

        .glass-pill {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .envelope-shadow {
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), 
                        0 10px 25px rgba(56, 189, 248, 0.15),
                        inset 0 0 40px rgba(255, 255, 255, 0.05);
        }

        .wax-seal-glow {
            box-shadow: 0 0 35px rgba(234, 179, 8, 0.4), 
                        0 0 15px rgba(56, 189, 248, 0.5),
                        inset 0 2px 4px rgba(255, 255, 255, 0.6);
        }

        .text-gradient-silver {
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-gradient-gold {
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-gradient-blue {
            background: linear-gradient(135deg, #e0f2fe 0%, #7dd3fc 50%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1deg); }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-glow { animation: pulseGlow 4s ease-in-out infinite; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b1329; }
        ::-webkit-scrollbar-thumb { background: rgba(125, 211, 252, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(125, 211, 252, 0.6); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [isOpen, setIsOpen] = useState(false);
            const [isOpening, setIsOpening] = useState(false);
            const [activeSection, setActiveSection] = useState('hero');
            const [isPlaying, setIsPlaying] = useState(false);
            const [guestName, setGuestName] = useState('');
            const [guestLang, setGuestLang] = useState('ar');
            const [copied, setCopied] = useState(false);
            const [wishes, setWishes] = useState([
                { id: 1, name: 'أحمد و سارة', message: 'ألف مبروك لأجمل عروسين! تتمنياتنا لكم بحياة مليئة بالحب والسعادة الدائمة.', date: 'منذ ساعتين' },
                { id: 2, name: 'Eng. Mahmoud & Family', message: 'Wishing you both a lifetime of happiness, love, and laughter! Congratulations Sayed & Lobna!', date: 'منذ 5 ساعات' },
                { id: 3, name: 'عائلة الألفي', message: 'بارك الله لكما وبارك عليكما وجمع بينكما في خير. منورين ومستعدين لليلة الفرح!', date: 'منذ يوم' }
            ]);
            const [newWishName, setNewWishName] = useState('');
            const [newWishText, setNewWishText] = useState('');
            const [lightboxImg, setLightboxImg] = useState(null);

            const audioRef = useRef(null);
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });

            useEffect(() => {
                const targetDate = new Date('2026-11-26T20:00:00+03:00').getTime();
                const interval = setInterval(() => {
                    const now = new Date().getTime();
                    const difference = targetDate - now;

                    if (difference > 0) {
                        setTimeLeft({
                            days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                            minutes: Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60)),
                            seconds: Math.floor((difference % (1000 * 60)) / 1000)
                        });
                    } else {
                        setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0 });
                    }
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            const toggleAudio = () => {
                if (audioRef.current) {
                    if (isPlaying) {
                        audioRef.current.pause();
                        setIsPlaying(false);
                    } else {
                        audioRef.current.play().then(() => setIsPlaying(true)).catch(() => setIsPlaying(false));
                    }
                }
            };

            const handleOpenEnvelope = () => {
                setIsOpening(true);
                setTimeout(() => {
                    setIsOpen(true);
                    if (audioRef.current) {
                        audioRef.current.play().then(() => setIsPlaying(true)).catch(() => {});
                    }
                }, 1800);
            };

            const scrollToSection = (id) => {
                setActiveSection(id);
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                }
            };

            const handleWishSubmit = (e) => {
                e.preventDefault();
                if (!newWishName.trim() || !newWishText.trim()) return;
                setWishes([{ id: Date.now(), name: newWishName, message: newWishText, date: 'الآن' }, ...wishes]);
                setNewWishName('');
                setNewWishText('');
            };

            const getGoogleCalendarUrl = () => {
                const title = encodeURIComponent("Sayed & Lobna's Wedding Celebration");
                const details = encodeURIComponent("Join us to celebrate the wedding of Sayed & Lobna!");
                const location = encodeURIComponent("https://maps.app.goo.gl/yJ3MdbmjYxvdyFN78?g_st=aw");
                return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=20261126T170000Z/20261126T230000Z&details=${details}&location=${location}`;
            };

            const downloadIcsFile = () => {
                const icsContent = `BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Sayed and Lobna Wedding//EN\nBEGIN:VEVENT\nSUMMARY:Wedding of Sayed & Lobna\nDESCRIPTION:We are delighted to invite you to celebrate our wedding!\nLOCATION:https://maps.app.goo.gl/yJ3MdbmjYxvdyFN78?g_st=aw\nDTSTART:20261126T170000Z\nDTEND:20261126T230000Z\nEND:VEVENT\nEND:VCALENDAR`;
                const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = window.URL.createObjectURL(blob);
                link.setAttribute('download', 'Sayed_Lobna_Wedding.ics');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const getCustomInviteText = () => {
                const nameStr = guestName.trim() ? guestName.trim() : (guestLang === 'ar' ? 'ضيفنا العزيز' : 'Dear Honored Guest');
                if (guestLang === 'ar') {
                    return `يسعدنا ويشرفنا دعوة ${nameStr} لحضور حفل زفاف "سيد و لبنى"\n\n🗓️ الخميس 26 نوفمبر 2026 الساعة 8:00 مساءً\n📍 موقع الحفل: https://maps.app.goo.gl/yJ3MdbmjYxvdyFN78?g_st=aw\n\nحضوركم يسعدنا وتكتمل به فرحتنا! ✨`;
                } else {
                    return `We are cordially honored to invite ${nameStr} to the wedding celebration of Sayed & Lobna.\n\n🗓️ Thursday, November 26, 2026 at 8:00 PM\n📍 Location: https://maps.app.goo.gl/yJ3MdbmjYxvdyFN78?g_st=aw\n\nYour presence will make our special day complete! ✨`;
                }
            };

            const copyInviteText = () => {
                navigator.clipboard.writeText(getCustomInviteText());
                setCopied(true);
                setTimeout(() => setCopied(false), 3000);
            };

            const shareWhatsApp = () => {
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(getCustomInviteText())}`, '_blank');
            };

            const galleryImages = [
                { url: 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=80', caption: 'Pure Elegance & Floral Details' },
                { url: 'https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1200&q=80', caption: 'The Promise of Forever' },
                { url: 'https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=1200&q=80', caption: 'Whispers of Love' },
                { url: 'https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=1200&q=80', caption: 'Golden Moments' },
                { url: 'https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=1200&q=80', caption: 'Celestial Rings & Vows' },
                { url: 'https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?auto=format&fit=crop&w=1200&q=80', caption: 'Atmospheric Luxury Venue' }
            ];

            return (
                <div dir="rtl" className="min-h-screen bg-[#0b1329] text-slate-100 selection:bg-sky-500 selection:text-white relative overflow-x-hidden">
                    <audio ref={audioRef} loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-wedding-piano-115567.mp3" />

                    {/* Ambient Glows */}
                    <div className="fixed inset-0 pointer-events-none z-0 opacity-40">
                        <div className="absolute top-[10%] right-[15%] w-96 h-96 bg-sky-600/20 rounded-full blur-[120px] animate-glow" />
                        <div className="absolute bottom-[20%] left-[10%] w-[500px] h-[500px] bg-indigo-600/15 rounded-full blur-[150px] animate-glow" style={{ animationDelay: '2s' }} />
                    </div>

                    {/* 3D ENVELOPE */}
                    {!isOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-[#050a17] p-4 sm:p-6 overflow-hidden">
                            <div className="relative w-full max-w-xl aspect-[16/11] sm:aspect-[16/10]">
                                <div className="absolute -inset-6 bg-gradient-to-tr from-sky-600/30 via-indigo-600/20 to-amber-500/20 rounded-3xl blur-3xl opacity-80 animate-pulse" />
                                
                                <div className={`relative w-full h-full rounded-3xl glass-card border border-sky-200/30 envelope-shadow flex flex-col justify-between overflow-hidden transition-all duration-1000 ${isOpening ? 'scale-110 opacity-0 -translate-y-24 duration-1200' : 'scale-100 opacity-100'}`}>
                                    
                                    <div className={`absolute top-0 left-0 right-0 h-[60%] bg-gradient-to-b from-slate-900 via-slate-800 to-indigo-950/90 border-b border-sky-300/40 transition-all duration-1000 z-20 ${isOpening ? 'opacity-0 -translate-y-full' : 'opacity-100'}`} style={{ clipPath: 'polygon(0 0, 100% 0, 50% 100%)' }}>
                                        <div className="absolute top-5 left-1/2 -translate-x-1/2 text-sky-200/60 font-montserrat text-[11px] tracking-[0.35em] uppercase">
                                            ✨ VIP Royal Invitation ✨
                                        </div>
                                    </div>

                                    <div className="pt-10 px-6 text-center z-10">
                                        <p className="font-montserrat text-sky-300/80 text-xs sm:text-sm tracking-[0.35em] uppercase mb-1">A Special Invitation For You</p>
                                        <h3 className="font-aref text-2xl sm:text-3xl text-gradient-silver">دعوة خاصة لحضور حفل زفاف</h3>
                                    </div>

                                    <div className="my-auto text-center z-10 py-2">
                                        <div className="font-cormorant text-4xl sm:text-5xl tracking-widest text-slate-100 font-semibold drop-shadow-lg">SAYED & LOBNA</div>
                                        <div className="font-amiri text-xl text-sky-300/90 mt-1">سيد & لبنى</div>
                                    </div>

                                    <div className="pb-8 flex flex-col items-center justify-center z-30">
                                        <button onClick={handleOpenEnvelope} disabled={isOpening} className="group relative flex flex-col items-center focus:outline-none cursor-pointer">
                                            <div className="w-22 h-22 sm:w-26 sm:h-26 rounded-full bg-gradient-to-br from-amber-500 via-blue-900 to-slate-950 border-2 border-amber-300/60 wax-seal-glow flex items-center justify-center transition-all duration-500 group-hover:scale-110">
                                                <div className="w-18 h-18 sm:w-20 sm:h-20 rounded-full border border-amber-200/40 bg-gradient-to-tr from-indigo-950 to-slate-900 flex flex-row items-center justify-center px-2">
                                                    <span className="font-cormorant font-bold text-xl sm:text-2xl text-gradient-gold tracking-wider whitespace-nowrap">S &amp; L</span>
                                                </div>
                                            </div>
                                            <div className="mt-4 flex items-center space-x-2 space-x-reverse text-sky-100 font-alexandria text-xs sm:text-sm tracking-wide bg-slate-900/80 px-5 py-2 rounded-full border border-amber-400/30 backdrop-blur-md">
                                                <span>✉️ اضغط لفتح الدعوة | Tap to Open</span>
                                            </div>
                                        </button>
                                    </div>

                                </div>
                            </div>
                        </div>
                    )}

                    {/* MAIN CONTENT */}
                    <main className={`transition-opacity duration-1000 ${isOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                        
                        {/* HERO */}
                        <section id="hero" className="relative min-h-screen flex items-center justify-center px-4 py-20 text-center">
                            <div className="relative z-10 max-w-4xl mx-auto space-y-8">
                                <div className="inline-flex items-center px-5 py-2 rounded-full glass-card text-sky-200 text-xs sm:text-sm font-montserrat tracking-[0.25em] uppercase border border-sky-300/30">
                                    ✨ Save The Date • Nov 26, 2026 ✨
                                </div>

                                <p className="font-aref text-2xl sm:text-3xl md:text-4xl text-sky-100/90 leading-relaxed max-w-2xl mx-auto">
                                    "بكل الحب والسعادة، يسعدنا دعوتكم لمشاركتنا أجمل لحظات العمر، في ليلة ستظل محفورة في قلوبنا."
                                </p>

                                <div className="py-6 space-y-4">
                                    <div className="font-cormorant text-6xl sm:text-8xl md:text-9xl tracking-tight font-light text-gradient-silver uppercase">SAYED</div>
                                    <div className="font-playfair text-3xl sm:text-5xl italic text-sky-300 font-serif flex items-center justify-center space-x-4 space-x-reverse">
                                        <span className="w-12 sm:w-24 h-[1px] bg-gradient-to-l from-sky-400/60 to-transparent"></span>
                                        <span>&</span>
                                        <span className="w-12 sm:w-24 h-[1px] bg-gradient-to-r from-sky-400/60 to-transparent"></span>
                                    </div>
                                    <div className="font-cormorant text-6xl sm:text-8xl md:text-9xl tracking-tight font-light text-gradient-silver uppercase">LOBNA</div>
                                    <div className="font-amiri text-2xl sm:text-3xl text-sky-200/80 tracking-widest pt-2">سيد & لبنى</div>
                                </div>

                                <div className="font-montserrat text-sm tracking-[0.3em] text-slate-300 uppercase">Two Hearts, One Beautiful Beginning</div>

                                <div className="pt-6 flex flex-wrap items-center justify-center gap-4">
                                    <button onClick={() => scrollToSection('location')} className="px-8 py-3.5 rounded-full bg-gradient-to-r from-sky-500 to-blue-600 text-white font-medium text-sm shadow-lg hover:scale-105 transition-all">
                                        📍 موقع الحفل | Venue Map
                                    </button>
                                    <button onClick={() => scrollToSection('guestbook')} className="px-8 py-3.5 rounded-full glass-card text-sky-100 font-medium text-sm border border-sky-200/30 hover:bg-white/10 transition-all">
                                        🤍 أرسل تهنئة | Leave Wishes
                                    </button>
                                </div>
                            </div>
                        </section>

                        {/* QURANIC VERSE */}
                        <section id="verse" className="py-20 px-4">
                            <div className="max-w-3xl mx-auto">
                                <div className="glass-card rounded-3xl p-8 sm:p-12 text-center relative border border-sky-300/30">
                                    <blockquote className="font-amiri text-2xl sm:text-3xl md:text-4xl text-sky-100 leading-loose mb-6">
                                        ﴿ وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنْفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِّقَوْمٍ يَتَفَكَّرُونَ ﴾
                                    </blockquote>
                                    <cite className="font-alexandria text-sm text-sky-300/80 tracking-widest block not-italic">سورة الروم – الآية 21</cite>
                                </div>
                            </div>
                        </section>

                        {/* COUNTDOWN */}
                        <section id="countdown" className="py-20 px-4 bg-slate-950/40 text-center">
                            <div className="max-w-4xl mx-auto space-y-10">
                                <div>
                                    <span className="font-montserrat text-xs text-sky-400 tracking-[0.3em] uppercase block mb-2">The Countdown</span>
                                    <h2 className="font-aref text-3xl sm:text-4xl text-gradient-silver">موعدنا المميز</h2>
                                    <p className="font-montserrat text-sm text-slate-300 tracking-widest uppercase mt-1">THURSDAY • 26 NOVEMBER 2026 • 8:00 PM</p>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                    {[
                                        { label: 'أيام / Days', value: timeLeft.days },
                                        { label: 'ساعات / Hours', value: timeLeft.hours },
                                        { label: 'دقائق / Minutes', value: timeLeft.minutes },
                                        { label: 'ثواني / Seconds', value: timeLeft.seconds }
                                    ].map((item, idx) => (
                                        <div key={idx} className="glass-card rounded-2xl p-6 border border-sky-300/20">
                                            <div className="font-cormorant text-4xl sm:text-6xl font-bold text-gradient-blue mb-2">{String(item.value).padStart(2, '0')}</div>
                                            <div className="font-alexandria text-xs text-slate-300">{item.label}</div>
                                        </div>
                                    ))}
                                </div>

                                <div className="flex flex-wrap items-center justify-center gap-4">
                                    <a href={getGoogleCalendarUrl()} target="_blank" rel="noopener noreferrer" className="px-6 py-3 rounded-full glass-card text-sky-100 border border-sky-300/40 text-xs sm:text-sm font-medium">
                                        📅 إضافة إلى Google Calendar
                                    </a>
                                    <button onClick={downloadIcsFile} className="px-6 py-3 rounded-full glass-card text-sky-100 border border-sky-300/40 text-xs sm:text-sm font-medium">
                                        📌 تحميل التقويم (.ics)
                                    </button>
                                </div>
                            </div>
                        </section>

                        {/* PERSONALIZED INVITATION */}
                        <section id="personalized" className="py-20 px-4">
                            <div className="max-w-4xl mx-auto space-y-10">
                                <div className="text-center">
                                    <h2 className="font-aref text-3xl sm:text-4xl text-gradient-silver">بطاقة دعوة باسمك</h2>
                                    <p className="font-alexandria text-sm text-slate-300 mt-2">اكتب اسمك أدناه لمشاركتها عبر واتساب</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                                    <div className="glass-card rounded-3xl p-6 space-y-5 border border-sky-300/20">
                                        <div>
                                            <label className="block text-xs text-sky-200 mb-2">اسم الضيف:</label>
                                            <input type="text" value={guestName} onChange={(e) => setGuestName(e.target.value)} placeholder="مثال: أحمد المحمدي" className="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-sky-300/30 text-white text-sm focus:outline-none" />
                                        </div>
                                        <div className="space-y-3">
                                            <button onClick={shareWhatsApp} className="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs sm:text-sm transition-colors">
                                                📲 مشاركة الدعوة عبر واتساب
                                            </button>
                                            <button onClick={copyInviteText} className="w-full py-3.5 rounded-xl glass-card text-slate-200 font-medium text-xs sm:text-sm border border-sky-300/30">
                                                {copied ? '✓ تم النسخ!' : '📋 نسخ نص الدعوة'}
                                            </button>
                                        </div>
                                    </div>

                                    <div className="glass-card-light rounded-3xl p-8 text-slate-900 text-center space-y-4">
                                        <div className="font-cormorant text-2xl font-bold">SAYED & LOBNA</div>
                                        <div className="w-12 h-[1px] bg-sky-400 mx-auto" />
                                        <div>
                                            <p className="font-alexandria text-xs text-sky-950">دعوة خاصة إلى:</p>
                                            <p className="font-aref text-2xl text-sky-700 font-bold mt-1">{guestName.trim() ? guestName : 'اسم الضيف الكريم'}</p>
                                        </div>
                                        <p className="font-alexandria text-xs text-slate-600">نأمل تشريفكم لنا لمشاركتنا فرحة العمر في ليلة من أجمل الليالي.</p>
                                        <div className="pt-4 border-t border-sky-200 text-[11px] flex justify-between">
                                            <span>26.11.2026</span>
                                            <span>8:00 PM</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* GALLERY */}
                        <section id="gallery" className="py-20 px-4 bg-slate-950/40">
                            <div className="max-w-6xl mx-auto space-y-8 text-center">
                                <h2 className="font-aref text-3xl sm:text-4xl text-gradient-silver">معرض الصور الراقية</h2>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {galleryImages.map((img, idx) => (
                                        <div key={idx} onClick={() => setLightboxImg(img)} className="group relative h-72 rounded-2xl overflow-hidden cursor-pointer glass-card border border-sky-300/20">
                                            <img src={img.url} alt={img.caption} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* LOCATION */}
                        <section id="location" className="py-20 px-4 text-center">
                            <div className="max-w-4xl mx-auto space-y-8">
                                <h2 className="font-aref text-3xl sm:text-4xl text-gradient-silver">مستنيينكم تنورونا</h2>
                                <div className="glass-card rounded-3xl p-8 border border-sky-300/30 space-y-6">
                                    <p className="font-alexandria text-xs sm:text-sm text-slate-300">تكتمل سعادتنا بحضوركم وتواجدكم معنا في موقع الحفل الفاخر</p>
                                    <a href="https://maps.app.goo.gl/yJ3MdbmjYxvdyFN78?g_st=aw" target="_blank" rel="noopener noreferrer" className="inline-block px-8 py-4 rounded-full bg-gradient-to-r from-sky-500 to-indigo-600 text-white font-medium text-sm shadow-xl hover:scale-105 transition-all">
                                        🗺️ OPEN WEDDING LOCATION | فتح الخريطة
                                    </a>
                                </div>
                            </div>
                        </section>

                        {/* GUESTBOOK */}
                        <section id="guestbook" className="py-20 px-4 bg-slate-950/40">
                            <div className="max-w-4xl mx-auto space-y-10">
                                <div className="text-center">
                                    <h2 className="font-aref text-3xl sm:text-4xl text-gradient-silver">اتركوا لنا تهنئة من القلب</h2>
                                </div>

                                <form onSubmit={handleWishSubmit} className="glass-card rounded-3xl p-6 space-y-4 border border-sky-300/20">
                                    <input type="text" required value={newWishName} onChange={(e) => setNewWishName(e.target.value)} placeholder="اسمك الكريم..." className="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-sky-300/30 text-white text-sm" />
                                    <textarea required rows="3" value={newWishText} onChange={(e) => setNewWishText(e.target.value)} placeholder="اكتب مباركتك للعروسين..." className="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-sky-300/30 text-white text-sm" />
                                    <button type="submit" className="px-8 py-3 rounded-xl bg-sky-500 text-white font-medium text-xs sm:text-sm">إرسال التهنئة 💌</button>
                                </form>

                                <div className="space-y-4">
                                    {wishes.map((w) => (
                                        <div key={w.id} className="glass-card rounded-2xl p-6 border border-sky-300/15 space-y-2">
                                            <div className="flex justify-between items-center">
                                                <h4 className="font-alexandria text-sm font-bold text-sky-200">{w.name}</h4>
                                                <span className="text-[11px] text-slate-400">{w.date}</span>
                                            </div>
                                            <p className="font-alexandria text-xs sm:text-sm text-slate-200">"{w.message}"</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* FOOTER */}
                        <section className="py-24 px-4 text-center">
                            <div className="font-cormorant text-5xl sm:text-7xl text-gradient-silver uppercase">SAYED & LOBNA</div>
                            <div className="font-montserrat text-xs tracking-[0.3em] text-sky-400 uppercase mt-2">Forever Begins Here</div>
                            <p className="font-aref text-2xl text-sky-100/90 pt-4">"وجودكم معانا هو أجمل هدية، وبكم تكتمل فرحتنا."</p>
                        </section>

                        {/* FLOATING NAVIGATION */}
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-40">
                            <nav className="glass-pill rounded-full px-4 py-2.5 flex items-center space-x-3 space-x-reverse border border-sky-300/30 shadow-2xl">
                                <button onClick={() => scrollToSection('hero')} className="p-2 text-slate-300 hover:text-white">✉️ الدعوة</button>
                                <button onClick={() => scrollToSection('verse')} className="p-2 text-slate-300 hover:text-white">✨ الآية</button>
                                <button onClick={() => scrollToSection('location')} className="p-2 text-slate-300 hover:text-white">📍 اللوكيشن</button>
                                <button onClick={() => scrollToSection('guestbook')} className="p-2 text-slate-300 hover:text-white">🤍 التهاني</button>
                                <div className="w-[1px] h-5 bg-slate-700" />
                                <button onClick={toggleAudio} className={`p-2 rounded-full ${isPlaying ? 'text-indigo-400 animate-pulse' : 'text-slate-400'}`}>
                                    {isPlaying ? '🔊 الموسيقى' : '🔇 الموسيقى'}
                                </button>
                            </nav>
                        </div>

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
